name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer validate --no-check-publish --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check Resources/Public/JavaScript/SidebarCollapse.js
      - run: python3 -c "import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]" Resources/Private/Translations/*/*.xlf
